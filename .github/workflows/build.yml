name: Test & Build
on:
  push:
    branches:
      - master

  pull_request:

jobs:
  install-go-modules:
    strategy:
      matrix:
        go: ["1.25.x", "1.24.x", "1.23.x"]

    runs-on: ubuntu-latest-large

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4  # v4
        with:
          go-version: ${{ matrix.go }}

      - name: Test install Go modules for v${{ matrix.go }}
        run: go install -v . && chamber version

  test:
    strategy:
      matrix:
        go: ["1.25.x", "1.24.x", "1.23.x"]
    runs-on: ubuntu-latest-large

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4  # v4
        with:
          go-version: ${{ matrix.go }}

      - name: Test
        run: make test

      - name: Check modules are tidy and checked in
        run: |
          export GO111MODULE=on
          go mod tidy
          if [ "$(git status --porcelain)" != "" ]; then
            echo "git tree is dirty after tidying modules"
            echo "ensure go.mod and go.sum are tidy"
            git status
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest-large

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4  # v4
        with:
          go-version: "1.25.x"

      - name: Run coverage
        run: make coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: segmentio/chamber

  dist:
    strategy:
      matrix:
        go: ["1.25.x", "1.24.x", "1.23.x"]
    runs-on: ubuntu-latest-large
    needs: test

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4  # v4
        with:
          go-version: ${{ matrix.go }}

      - name: Install nfpm, rpmbuild
        run: sudo make -f Makefile.tools nfpm-debian rpmbuild-debian

      - name: Make distributables
        run: make -f Makefile.release dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist-${{ matrix.go }}
          path: "dist/*"
